name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: ci-only-not-for-production
      DEBUG: "True"
      BEHIND_TLS_PROXY: "False"
      EMAIL_PROVIDER: brevo
      EMAIL_FROM: ci@example.invalid
      EMAIL_FROM_NAME: CI
      GROQ_API_KEY: ci-placeholder
      RAZORPAY_KEY_ID: ""
      RAZORPAY_KEY_SECRET: ""
      RAZORPAY_WEBHOOK_SECRET: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Dependency consistency
        run: python -m pip check

      - name: Django system check
        run: python manage.py check

      - name: Check migration drift
        run: python manage.py makemigrations --check --dry-run

      - name: Run test suite
        run: python manage.py test accounts
